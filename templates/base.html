<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Report Pulizie{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <h1>Report Pulizie</h1>
        <nav>
          {% if current_user %}
            <a href="{{ url_for('index') }}">Elenco</a>
            <a href="{{ url_for('new_report') }}">Nuovo Report</a>
            {% if current_user.is_admin %}
              <a href="{{ url_for('admin_dashboard') }}">Admin</a>
            {% endif %}
            <form method="post" action="{{ url_for('logout') }}" class="nav-logout">
              <button type="submit">{{ current_user.display_name }} - Esci</button>
            </form>
          {% else %}
            <a href="{{ url_for('login') }}">Login</a>
          {% endif %}
        </nav>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
